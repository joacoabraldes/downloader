# Cuadro de parámetros de desestacionalización X-13ARIMA-SEATS por serie.
#
# El ETL relee este archivo al desestacionalizar (ver etl/core/desest_params.py). Cada
# corrida busca acá qué series de un dataset hay que ajustar y con qué parámetros. Estos
# valores salieron de calibrar cada serie contra su referencia (error 0.00%, salvo autos
# ventas que no reproduce exacto y va en modo automático, ~0.33%).
#
# Para AGREGAR una serie nueva a desestacionalizar:
#   1. Sumar su nombre a `desest` del dataset (debe existir en la tabla de ese dataset).
#   2. Si difiere del default del dataset, agregar un override [<dataset>.overrides.<serie>].
# Para AGREGAR un dataset nuevo: crear un bloque [<dataset>] con table/desest y su default.
#
# Parámetros:
#   table       tabla postgres (formato long) de la que sale la serie observada.
#   desest      series (dentro de esa tabla) a desestacionalizar.
#   mode        add  = aditivo (transform=none; admite ceros)
#               mult = multiplicativo (transform=log; requiere serie > 0)
#               auto = X-13 elige el modo por AIC (transform=auto)
#   td          td1coef = trading-day 1 coef | td = trading-day 6 coef | none = sin ajuste
#   seasonalma  filtro estacional del X-11 (s3x5 es el estándar).
#   start       (opcional) fecha YYYY-MM-DD desde la que se desestacionaliza: recorta el
#               histórico observado a >= start antes de correr X-13. Sirve para excluir un
#               prefijo degenerado (ceros / cambios de escala) que cuelga a automdl/X-11.
#
# Nota: aunque `mode` diga mult/auto, si la serie tiene algún valor <= 0 el ETL fuerza
# aditivo (el X-11 multiplicativo/log no admite ceros).

[granos]
table = "etl_molienda_granos"
# Solo `soja` está calibrada contra referencia; el resto hereda la misma receta (misma
# naturaleza de serie). Ajustar con overrides si alguno no matchea. Se excluyen algodon,
# cartamo y canola: su molienda es intermitente (mayormente ceros incluso desde 2003), X-13
# no puede ajustarlas (falla con "exceeds regression effects allowed"). Quedan crudas.
# `lino` se excluye por lo mismo, aunque falle distinto: no aborta, converge en ~150s (arriba
# del timeout de 120s de seasonal.py) y termina con "Series should not be a candidate for
# seasonal adjustment ... no visually significant seasonal peaks". Con 26% de ceros y rachas
# de hasta 9 meses, no hay estacionalidad que ajustar. Queda cruda.
desest = ["total", "soja", "girasol", "mani"]
mode = "add"
td = "none"
seasonalma = "s3x5"
# La tabla tiene histórico crudo desde 1965, pero ese tramo (prefijo de ceros / cambio de
# escala de 0 a millones) cuelga a X-13. Se desestacionaliza desde 2003-01, igual que la
# referencia de calibración (molienda_soja.xlsx) y donde arrancan las 8 series.
start = 2003-01-01

[automotriz]
table = "etl_automotriz"
desest = ["produccion", "ventas", "expo"]
mode = "add"        # produccion y expo reproducen exacto en aditivo + td1coef
td = "td1coef"
seasonalma = "s3x5"

# Ventas no reproduce exacto con ninguna config fija: el mejor ajuste (0.33% vs referencia)
# es dejar que X-13 elija el modo y testee el trading-day por AIC.
[automotriz.overrides.ventas]
mode = "auto"
td = "td"

[cemento]
table = "etl_cemento_despacho"
desest = ["despacho_nacional"]   # las otras 3 series (expo/consumo/import) no se ajustan
mode = "mult"
td = "td"            # cemento reproduce exacto en multiplicativo + trading-day de 6 coef
seasonalma = "s3x5"

# Patentamientos 0km (SIOMAA), 4W. Todas las categorías del mercado son series de flujo
# mensual, siempre positivas (histórico desde 2022, sin ceros). Sin referencia de
# calibración: mode=auto deja que X-13 elija add/mult por AIC. Ajustar con overrides si
# alguna categoría no matchea contra una referencia futura.
[bovinos]
table = "etl_bovinos"
desest = ["produccion"]
# add + td1coef + s3x5 es lo que MÁS se acerca a la referencia (Bovinos.xlsx col desest):
# ~0.29% error medio (3% máx). NO reproduce exacto (como aves): la referencia se hizo con un
# método algo distinto de X-13.
mode = "add"
td = "td1coef"
seasonalma = "s3x5"

[leche]
table = "etl_leche"
desest = ["produccion"]
# Calibrado contra la referencia (leche.xlsx, columna desest): add + td1coef + s3x5 reproduce
# el d11 con error ~0 (máx 0.0002% sobre 137 meses). Los valores son litros (~9 dígitos): el
# núcleo envuelve las líneas del .spc por ancho para que X-13 no parta un número.
mode = "add"
td = "td1coef"
seasonalma = "s3x5"

[aves]
table = "etl_aves"
desest = ["faena"]
# Faena es multiplicativa (log). mult + td (6 coef) + s3x5 es lo que MÁS se acerca a la
# referencia (Aves.xlsx col desest): ~0.26% error medio, 1.73% máx. NO reproduce exacto
# (a diferencia de acero): la referencia se hizo con un método algo distinto de X-13.
mode = "mult"
td = "td"
seasonalma = "s3x5"

[acero]
table = "etl_acero"
desest = ["acero_crudo"]
# Calibrado contra la referencia (Acero.xlsx, columna desest): add + td1coef + s3x5
# reproduce el d11 con error ~0 (máx 0.001%). En modo auto X-13 elige lo mismo.
mode = "add"
td = "td1coef"
seasonalma = "s3x5"

[demanda_energia]
table = "etl_demanda_energia"
desest = ["no_residencial"]
# Demanda no residencial del MEM (GWh). Calibrado contra la referencia (energia.xlsx, columna
# desest): add + td1coef + s3x5 reproduce el d11 con error ~0 (medio 0.0000%, máx 0.0001% sobre
# 257 meses). En modo auto X-13 elige lo mismo. La serie empalma energia.xlsx (2005→2022) con
# CAMMESA (2023→), contigua, sin huecos: no necesita `start`.
mode = "add"
td = "td1coef"
seasonalma = "s3x5"

# Producción de hidrocarburos (Secretaría de Energía). Se desestacionalizan SOLO los dos
# totales; el desagregado por tipo de recurso (convencional/shale/tight) queda crudo: son
# componentes de esos totales y ajustarlos por separado rompería la identidad
# total = convencional + shale + tight sin dar nada a cambio. Mismo criterio que comex con el
# índice de valor.
#
# CALIBRADO contra la columna desest de los Excel de referencia (scripts/calibrar_hidrocarburos.py).
# El barrido ordena por el error hasta 2018-12 y NO por el del período completo, a propósito: la
# referencia se calculó sobre el observado de la compilación del Min. de Economía, que de 2019 en
# adelante corre ~1% por debajo del primario que ingestamos (ver schema.sql). Ese ~1% está en el
# insumo, no en la receta: ninguna combinación de parámetros lo cierra. Hasta 2018 las dos fuentes
# coinciden y ahí la comparación mide de verdad.
#
# El salto entre las dos ventanas confirma el diagnóstico: en gas el error casi no se mueve
# (0.061% -> 0.070%) porque las fuentes coinciden en todo el tramo; en petróleo se duplica
# (0.190% -> 0.394%) que es exactamente donde entra el cambio de fuente.
#
# Sin `start`: las dos series arrancan en 1996-01 y son contiguas (367 meses, sin huecos).
[hidrocarburos]
table = "etl_hidrocarburos"
desest = ["petroleo", "gas"]
# add + td1coef + s3x5 es lo que MÁS se acerca en gas: 0.061% de error medio (2.05% máx) hasta
# 2018. NO reproduce exacto (como aves o bovinos): la referencia se hizo con un método algo
# distinto de X-13. Ojo con `mult`, que parece la elección natural para una serie de producción
# estrictamente positiva: acá es 5x peor (0.34% medio, 8.09% máx). El pico de invierno del gas
# es grande pero NO escala con el nivel — la calefacción la manda el clima y el parque de
# usuarios, no cuánto se produce.
mode = "add"
td = "td1coef"
seasonalma = "s3x5"

# Petróleo NO lleva ajuste por días hábiles: `none` da 0.190% de error medio (1.04% máx) contra
# 0.359% y 3.66% de máximo con td1coef. Tiene sentido físico y coincide con lo medido: el perfil
# estacional de la serie es de -1.6% invierno/verano una vez sacado el efecto calendario, o sea
# esencialmente plano. Un pozo no cierra los domingos ni rinde distinto un martes; el regresor de
# trading-day no tiene nada que explicar y mete ruido. El gas sí lo lleva porque su demanda es de
# consumo y ahí el calendario del mes pesa.
[hidrocarburos.overrides.petroleo]
td = "none"

[patentamientos]
table = "etl_patentamientos"
desest = ["total_mercado", "autos", "comercial_liviano", "comercial_pesado",
          "otros_pesados", "autos_cl", "autos_cl_cp"]
mode = "auto"
td = "td1coef"
seasonalma = "s3x5"
# El informe de nov-2022 es pago (no está en el histórico), lo que deja un hueco. X-13 exige
# meses contiguos, así que la desest arranca en la corrida contigua más larga: 2022-12 en
# adelante (43 meses). Los meses ene..oct-2022 quedan guardados como observados, sin ajustar.
start = 2022-12-01

# escrituras_caba: NO se desestacionaliza, a propósito. Por dos razones independientes.
#
# 1. La serie tiene HUECOS. La fuente no publicó informe para 6 meses (2016-04, 2016-09,
#    2017-01, 2022-12, 2023-01, 2023-02) y X-13 exige meses contiguos. Los seis están
#    rellenados desde planillas de informes posteriores, así que hoy la serie es contigua,
#    pero el relleno es un parche de una fuente secundaria: no es base para un ajuste.
# 2. No hay contra qué calibrar. Todas las series de este archivo se ajustaron contra una
#    columna "desest" de una planilla de referencia hasta reproducirla. El Colegio de
#    Escribanos publica el conteo crudo: cualquier receta que eligiéramos sería un número
#    inventado por nosotros.
#
# Además, el pedido explícito fue "cantidad por ahora". Si en algún momento se quiere ajustar,
# sumarlo es agregar acá un bloque [escrituras_caba] con table/desest/mode/td/seasonalma; la
# tabla y la vista etl_escrituras_caba_desest ya existen y hoy devuelven 0 filas.

# icc / icg (UTDT): NO se desestacionalizan, a propósito. No es un olvido.
#
# 1. No hay contra qué calibrar. Todas las series de este archivo se ajustaron contra una
#    columna "desest" de una planilla de referencia hasta reproducirla. UTDT publica el ICC y
#    el ICG SIN ajuste estacional, así que no existe esa referencia: cualquier receta que
#    eligiéramos sería un número inventado por nosotros, no "el ICC desestacionalizado".
# 2. Son índices de opinión, no series de flujo. El resto de este archivo ajusta producción,
#    despachos y faena, donde la estacionalidad es de calendario. La convención para los
#    índices de confianza es publicarlos crudos.
#
# Si en algún momento aparece una referencia contra la cual calibrar, sumarlos es agregar acá
# un bloque [icc] / [icg] con table/desest/mode/td/seasonalma. Las tablas y las vistas
# etl_icc_desest / etl_icg_desest ya existen y hoy devuelven 0 filas.

# datos_gob: se desestacionalizan SOLO las dos series de ventas, y sobre su serie REAL.
#
# Por qué sólo esas dos: ipc_nacional es un índice de precios, expo/impo están en dólares y
# quedan fuera de este pedido, y para isac/ipi la desestacionalizada la publica el propio INDEC
# como serie aparte (p. ej. IPI: 453.1_SERIE_DESEADA_0_0_24_58). Para esas, lo correcto es bajar
# la serie oficial —una fila más en SERIES_META— y no correrles X-13 nosotros encima.
#
# Por qué sobre la REAL y no sobre la nominal: bajo inflación argentina la estacionalidad de una
# serie en pesos corrientes queda tapada por la deriva de precios, así que desestacionalizar el
# nominal no dice nada útil. De ahí el `view` de abajo, que apunta a la serie deflactada.
[datos_gob]
table = "etl_datos_gob"
# Insumo: la serie deflactada, NO la nominal. OJO: `etl_datos_gob_real` deflacta con DOS índices
# según la serie —'ipc_largo' para las de pesos, 'uscpi_mensual' (CPI-U del BLS, NSA) para
# expo/impo—, así que acá conviven pesos constantes y dólares constantes. A X-13 le da igual:
# ajusta cada serie por separado y es invariante a escala.
view = "etl_datos_gob_real"
desest = ["ventas_supermercados", "ventas_centros_compras", "expo_total", "impo_total"]
# mult: son ventas, estrictamente positivas y con estacionalidad proporcional al nivel (el pico
# de diciembre escala con la serie). Además el modo multiplicativo es invariante a la escala, así
# que cambiar el mes base del deflactor no altera la descomposición: sólo reescala el d11.
mode = "mult"
# td (6 coef): en comercio minorista la composición del calendario del mes pesa (cuántos sábados
# y domingos caen), más que en una serie de producción.
td = "td"
seasonalma = "s3x5"
# SIN REFERENCIA DE CALIBRACIÓN: a diferencia de acero/leche/cemento, INDEC no publica una versión
# desestacionalizada de estas dos series contra la cual verificar que reproducimos su número. Los
# parámetros de arriba son los razonables para una serie de ventas minoristas, no los que
# reproducen un resultado oficial. Si algún día aparece esa referencia, recalibrar.

# Comercio exterior (INDEC, ICA). Heredan mult del dataset —son valores estrictamente positivos
# (mínimo histórico USD 593 M) con estacionalidad proporcional al nivel: la cosecha gruesa mueve
# las exportaciones en proporción, no en una constante de dólares.
#
# td1coef en vez del td de 6 coeficientes del default: lo que mueve el valor despachado en un mes
# es cuántos días hábiles tuvo la aduana, un contraste hábil/no hábil. Distinguir lunes de martes
# —que es lo que agrega el td de 6— tiene sentido en comercio minorista, donde el sábado pesa
# distinto; en un registro aduanero son 5 regresores más sin hipótesis detrás.
#
# SIN REFERENCIA DE CALIBRACIÓN, y acá hay un matiz: INDEC publica series desestacionalizadas de
# comercio exterior en el informe del ICA, pero sobre los valores NOMINALES en dólares. No sirven
# de referencia para estas, que salen de la serie deflactada por CPI. No son el mismo número y no
# tienen por qué coincidir.
[datos_gob.overrides.expo_total]
td = "td1coef"

[datos_gob.overrides.impo_total]
td = "td1coef"

# Índices de comercio exterior del INDEC (ICA), base 2004=100. Se desestacionalizan SOLO las 6
# series de CANTIDAD (5 rubros de expo + nivel general de impo).
#
# Por qué sólo las de cantidad: son el volumen físico despachado, que es lo que se compara mes
# contra mes y lo que trae la estacionalidad de la cosecha. El índice de PRECIO no se ajusta
# (un precio no tiene estacionalidad de calendario que sacarle, igual que no se le corre X-13 al
# ipc_nacional), y el de VALOR es el producto de los otros dos: desestacionalizarlo aparte
# rompería la identidad valor = precio x cantidad sin dar nada a cambio.
#
# mult: las seis son estrictamente positivas (el mínimo histórico es 11.61, cantidad de
# combustibles) y su estacionalidad escala con el nivel: la cosecha gruesa mueve el volumen
# exportado en proporción, no en una constante de índice.
#
# td1coef, no el td de 6 coeficientes: lo que mueve el volumen despachado en un mes es cuántos
# días hábiles tuvo la aduana, un contraste hábil/no hábil. Distinguir lunes de martes tiene
# sentido en comercio minorista; en un registro aduanero son 5 regresores más sin hipótesis
# detrás. Es el mismo criterio que expo_total / impo_total en datos_gob.
#
# SIN REFERENCIA DE CALIBRACIÓN: INDEC publica estos índices crudos. En el informe del ICA sí
# hay series desestacionalizadas, pero de los VALORES en dólares, no de estos índices de
# cantidad: no son el mismo número y no tienen por qué coincidir. Los parámetros de arriba son
# los razonables para una serie de volumen, no los que reproducen un resultado oficial. Si
# algún día aparece esa referencia, recalibrar.
#
# Sin `start`: la serie arranca en 2004-01 y es contigua (270 meses al 2026-08, sin huecos).
[comex]
table = "etl_comex"
desest = ["expo_cantidad_general", "expo_cantidad_primarios", "expo_cantidad_moa",
          "expo_cantidad_moi", "expo_cantidad_combustibles", "impo_cantidad_general"]
mode = "mult"
td = "td1coef"
seasonalma = "s3x5"
